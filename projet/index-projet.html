<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
    <script src="js-projet.js"></script>
    <script src="../navbar.js"></script>
    <link rel="stylesheet" href="style-projet.css">
</head>

<body>
    <header>
        <main-nav></main-nav>
    </header>
    <main>
        <section class="card container mt-4" id="intro-proj">
            <div class="card-body">
                <h1 id="titre-proj" class="card-title"></h1>
                <span id="duree-proj" class="card-subtitle text-body-secondary"></span>
                <p id="contexte-proj" class="card-text"></p>
            </div>
        </section>

        <section id="image-proj" class="card container">
            <div class="card-body ">
                <h2 class="card-title mb-4">Images</h2>
                <div id="image-content">

                </div>
            </div>
        </section>

        <section class="card container" id="techno-proj">
            <div class="card-body">
                <h2 class="card-title mb-4">Technologies</h2>
                <div id="techno-content" class="d-flex flex-wrap gap-5 overflow-auto pb-3 justify-content-center">
                </div>
            </div>
        </section>

        <section class="card container" id="comp-proj">
            <div class="card-body">
                <h2 class="card-title mb-4">Compétences acquises</h2>
                <ul class="list-group list-group-flush"></ul>
            </div>
        </section>

        <section class="card container" id="git-proj">
            <div class="card-body">
                <h2 class="card-title">Git</h2>
                <div id="git-content" class="d-flex gap-4"></div>
            </div>
        </section>
    </main>
</body>

</html>
